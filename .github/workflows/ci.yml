name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version: "1.27.x"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: GOMAXPROCS=4 go vet -p=4 ./...
      - name: go test
        run: GOMAXPROCS=4 go test -count=1 -p=4 ./...
      - name: go test -race
        run: GOMAXPROCS=4 go test -race -p=4 ./... -count=1
      - name: go build
        run: GOMAXPROCS=4 CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -p=4 -trimpath -ldflags='-s -w' -o /tmp/fillwire ./cmd/fillwire
      - name: container build
        run: docker buildx build --load --platform linux/amd64 --tag "fillwire:pr-${GITHUB_SHA}" .

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Build and push immutable image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/fillwire:sha-${{ github.sha }}
        run: docker buildx build --push --platform linux/amd64 --tag "$IMAGE" --label org.opencontainers.image.revision="${GITHUB_SHA}" .
      - name: Surface pushed digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/fillwire:sha-${{ github.sha }}
        run: |
          DIGEST="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"
          test -n "$DIGEST"
          echo "Pushed image: $IMAGE@$DIGEST"
          printf '%s\n' '### GHCR image' "- image: \`$IMAGE\`" "- digest: \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
