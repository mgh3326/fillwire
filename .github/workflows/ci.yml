name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The measurement path for a branch: workflow_run only fires from the
  # default branch, so a branch's main stage is dispatched explicitly. GitHub
  # only dispatches workflows that exist on the default branch, so
  # suite=deploy is the pre-merge path to the deploy stage (deploy.yml also
  # keeps its own workflow_dispatch for after merge).
  workflow_dispatch:
    inputs:
      suite:
        description: 'main stage (all) or the deploy stage only (deploy)'
        required: false
        default: all
        type: choice
        options:
          - all
          - deploy
      ref:
        description: Candidate ref/sha for suite=deploy; empty uses this dispatch's ref
        required: false
        default: ''
        type: string

concurrency:
  # A newer push to main cancels the older main-stage run. Pull request and
  # dispatch runs keep their own group, so their behaviour is unchanged.
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('ci-main-{0}', github.ref) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite != 'deploy' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/setup-go-cached
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: GOMAXPROCS=4 go vet -p=4 ./...
      - name: go test
        run: GOMAXPROCS=4 go test -count=1 -p=4 ./...
      # The full -race suite is the deploy stage's job (operator decision
      # 2026-11-07, hk:doc decision/2026-11-07/fleet-ci-three-tiers-r2 §1);
      # pull requests keep today's check unchanged.
      - name: go test -race
        if: github.event_name == 'pull_request'
        run: GOMAXPROCS=4 go test -race -p=4 ./... -count=1
      - name: go build
        run: GOMAXPROCS=4 CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -p=4 -trimpath -ldflags='-s -w' -o /tmp/fillwire ./cmd/fillwire
      # Imported from broker-edge (hk 5872): its CI ran this script test too. The
      # Go packages are already covered by the vet and test steps above.
      - name: edge deploy-pull script test
        run: sh scripts/edge/deploy-pull_test.sh
      # The main stage's image build is publish (below), which builds and
      # pushes the same image to GHCR. Pull requests keep the local build.
      - name: container build
        if: github.event_name == 'pull_request'
        run: docker buildx build --load --platform linux/amd64 --tag "fillwire:pr-${GITHUB_SHA}" .
      - name: edge container build
        if: github.event_name == 'pull_request'
        run: docker buildx build --load --platform linux/amd64 --file Dockerfile.edge --tag "broker-edge:pr-${GITHUB_SHA}" .

  secrets:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite != 'deploy' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks-action scans a pull request as <first commit>^..head, which
      # errors on a root commit; the broker-edge import (hk 5872) carries one.
      # Pull requests therefore run the same gitleaks release directly, pinned
      # by version and sha256 (checksums.txt of the v8.24.3 release), over
      # base..head, which includes every imported commit.
      - name: gitleaks (pull request)
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --redact -v --exit-code=2 --no-banner --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}"
      - name: gitleaks
        if: github.event_name != 'pull_request'
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Set up multi-platform builder
        run: docker buildx create --driver docker-container --use
      - name: Build and push immutable image
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: bash scripts/publish-image.sh --push "$IMAGE_OWNER" "$GITHUB_SHA"

  auto-tag-test:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite != 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 scripts/test-auto-tag.py
      - run: python3 scripts/test-repair-release.py
      - run: python3 scripts/test-any-ref-statuses.py

  ci-ok-status:
    name: ci-ok status
    # Main-stage aggregation (r2 §1). A run whose only non-success results are
    # cancellations is unknown, so this job is skipped and no status is posted
    # (a newer push owns the ref). A skipped needed job runs it red, except
    # publish outside a push, where skipped is its normal result, and publish
    # skipped because verify or secrets was cancelled, which is a cancellation.
    # A failed needed job posts failure and fails this job, so a failed main
    # stage cannot trigger the deploy stage.
    if: ${{ always() && github.event_name != 'pull_request' && (inputs.suite || 'all') != 'deploy' && (contains(needs.*.result, 'failure') || !contains(needs.*.result, 'cancelled') || needs.verify.result == 'skipped' || needs.secrets.result == 'skipped' || needs.auto-tag-test.result == 'skipped' || (github.event_name == 'push' && needs.publish.result == 'skipped' && !contains(needs.*.result, 'cancelled'))) }}
    needs: [verify, secrets, publish, auto-tag-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Post ci-ok commit status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          AUTO_TAG_RESULT: ${{ needs.auto-tag-test.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          state=success
          for result in "$VERIFY_RESULT" "$SECRETS_RESULT" "$AUTO_TAG_RESULT"; do
            [ "$result" = success ] || state=failure
          done
          if [ "$EVENT" = push ]; then
            [ "$PUBLISH_RESULT" = success ] || state=failure
          else
            case "$PUBLISH_RESULT" in
              success|skipped) ;;
              *) state=failure ;;
            esac
          fi
          if [ "$state" = success ]; then
            description="main stage: success"
          else
            description="main stage: failure"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context=ci-ok \
            -f target_url="$RUN_URL" \
            -f description="$description"
          [ "$state" = success ]

  deploy-dispatch:
    # Pre-merge manual path to the deploy stage. It runs the same reusable
    # workflow as the automatic workflow_run path, so it posts the same
    # deploy-ok status on the resolved sha.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'deploy' }}
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
