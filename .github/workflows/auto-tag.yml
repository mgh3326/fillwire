# GitHub App/PAT main merges trigger push normally. If an Actions workflow
# merges using GITHUB_TOKEN, explicitly dispatch this workflow at main afterward.
name: Auto tag
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: auto-tag-${{ github.sha }}
  cancel-in-progress: false
jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Tag and dispatch release
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/auto-tag.py
