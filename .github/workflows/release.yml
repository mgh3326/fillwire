name: Release

# A v* tag builds the four CGO-disabled release binaries (linux/darwin x
# amd64/arm64) plus SHA256SUMS and publishes them to the tag's GitHub Release
# with GITHUB_TOKEN. A test tag v0.0.0* (e.g. v0.0.0-test.1) runs the same
# build and checks on the tag but is never published.
# Pull requests and manual runs build the same assets for a
# dry-run tag (v0.0.0-dryrun.<run>) and check checksums and `mergewake --version`
# without publishing anything. Hosts pull published assets themselves; this
# workflow never reaches a host.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish assets for the selected tag
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested publication ref
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTAG'
          import os, re
          if os.environ['REF_TYPE'] != 'tag' or not re.fullmatch(r'v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?', os.environ['REF_NAME']):
              raise SystemExit('publication requires a vMAJOR.MINOR.PATCH tag')
          PYTAG
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/setup-go-cached
      - name: Resolve release tag
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            echo "RELEASE_TAG=$REF_NAME" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v0.0.0-dryrun.$RUN_NUMBER" >> "$GITHUB_ENV"
          fi
      - name: Cross-build and verify release assets
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/release
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath \
              -ldflags="-s -w -X main.version=$RELEASE_TAG -X main.commit=$GITHUB_SHA" \
              -o "dist/release/fillwire-${target%/*}-${target#*/}" ./cmd/fillwire
          done
          (cd dist/release && sha256sum fillwire-* > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Keep assets for publish
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref_type == 'tag' && !startsWith(github.ref_name, 'v0.0.0')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  test:
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref_type == 'tag' && !startsWith(github.ref_name, 'v0.0.0')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/setup-go-cached
      - run: go vet ./...
      - run: go test -race ./...

  publish:
    needs: [build, test]
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref_type == 'tag' && !startsWith(github.ref_name, 'v0.0.0')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist/release
      # The checkouts above use github.sha; refuse if the tag was moved since.
      - name: Check the tag still points at the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" -q .sha)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "tag $TAG now points at $tagged, but the assets were built from $GITHUB_SHA" >&2
            exit 1
          fi
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        # A -suffix tag (v1.2.3-rc.1) is a pre-release: never "Latest", so
        # hosts that follow the latest release do not pick it up.
        run: |
          set --
          case "$RELEASE_TAG" in *-*) set -- --prerelease ;; esac
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            sh scripts/repair-release-assets.sh "$GITHUB_REF_NAME" dist/release
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "$@"
