name: Post CI any-ref statuses

# workflow_run loads this file from the default branch. Only the poster can
# write commit statuses; the dispatch workflow and tested commit stay read-only.
on:
  workflow_run:
    workflows: ["CI (any ref)"]
    types: [completed]

permissions:
  contents: read

jobs:
  resolve:
    name: resolve any-ref target
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      has_target: ${{ steps.target.outputs.has_target }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Read the commit recorded by the run
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          jobs="$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs")"
          validate="$(jq -r '[.jobs[] | select(.name == "validate ref")][0].conclusion // "none"' <<< "$jobs")"
          record="$(jq -r '[.jobs[] | select(.name == "record any-ref target")][0].conclusion // "none"' <<< "$jobs")"
          if [ "$validate" != success ]; then
            echo "run $RUN_ID: validate ref was $validate; it recorded no target; nothing to post"
            echo "has_target=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$record" != success ]; then
            echo "run $RUN_ID passed validation but record any-ref target was $record; retry the run" >&2
            exit 1
          fi
          dir="$RUNNER_TEMP/any-ref-target"
          gh run download "$RUN_ID" --repo "$REPO" --name any-ref-target --dir "$dir"
          sha="$(cat "$dir/sha.txt")"
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "the recorded target is not an exact 40-hex SHA" >&2
            exit 1
          fi
          echo "has_target=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  post:
    name: post any-ref statuses
    needs: resolve
    if: ${{ needs.resolve.outputs.has_target == 'true' }}
    concurrency:
      # A distinct group per run prevents GitHub's single pending slot from
      # silently replacing an older poster. The helper reconciles stale posts.
      group: ci-any-ref-status-${{ needs.resolve.outputs.sha }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Post verify and secrets statuses
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve.outputs.sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/any-ref-target"
          gh run download "$RUN_ID" --repo "$REPO" --name any-ref-target --dir "$dir"
          published="$(printf '%s\n' verify secrets | sort)"
          recorded="$(sort "$dir/expected-checks.txt")"
          if [ "$published" != "$recorded" ]; then
            echo "the recorded check names differ from the names this workflow publishes" >&2
            exit 1
          fi
          python3 .github/scripts/any_ref_statuses.py \
            --repo "$REPO" \
            --sha "$SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --target-url "$RUN_URL" \
            --posted-file "$RUNNER_TEMP/any-ref-posted.txt" \
            --watch verify \
            --watch secrets

      - name: Post failure for any status not written
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve.outputs.sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          posted="$RUNNER_TEMP/any-ref-posted.txt"
          for context in verify secrets; do
            if [ -f "$posted" ] && grep -Fxq "$context" "$posted"; then
              continue
            fi
            attempt=1
            until gh api "repos/${REPO}/statuses/${SHA}" \
              -f state=failure \
              -f context="$context" \
              -f target_url="$RUN_URL" \
              -f description="any-ref CI could not publish its verdict; retry required"; do
              if [ "$attempt" -ge 4 ]; then
                echo "could not post fallback failure for $context" >&2
                exit 1
              fi
              sleep "$attempt"
              attempt=$((attempt + 1))
            done
          done
