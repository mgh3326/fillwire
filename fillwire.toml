# Example-only configuration. All credentials are read from environment names;
# no credential value belongs in this public repository.

[kis]
broker = "kis"
endpoint = "live" # live or mock; this also selects the matching KIS TR.
account_mode = "live"
approval_mode = "" # "" (default): Redis single-flight issue and refresh; "cache-only": read the cached key only; "gatewayd": ask gatewayd to ensure the shared key, then read Redis; "gatewayd-fetch": fetch the key from gatewayd and keep it in memory, no Redis (see [kis.gatewayd]).
approval_refresh_margin = "1h"
venue = "krx"
hts_id = "EXAMPLE_HTS_ID"
# KIS app credentials are required only when approval_mode = "" (fillwire
# issues approval keys itself) or [books] enabled = true (the book producer
# sends them on REST reads). With "cache-only" or "gatewayd" and books off
# the names may be omitted; a configured name whose variable is unset is not
# an error and the value is never read.
app_key_env = "KIS_APP_KEY"
app_secret_env = "KIS_APP_SECRET"
event_buffer = 256
dup_track_max = 10000

# gatewayd approval mode (approval_mode = "gatewayd"). fillwire never issues an
# approval key locally in this mode: on a cache miss it POSTs
# /v1/tokens/{provider}/ensure on gatewayd (kis-live-approval or
# kis-mock-approval, chosen by account_mode), then reads the shared key back
# from Redis, polling briefly. The HTTP call is only an acknowledgement;
# Redis stays authoritative. The token below is sent as the named header on
# that POST only and is never logged. Unknown keys in this table reject the
# config; url/token_env/token_header take effect only when approval_mode is
# "gatewayd" or "gatewayd-fetch".
# "gatewayd-fetch" needs a gatewayd that serves POST /v1/tokens/{provider}/fetch
# (hk 5760): deploy that first. It POSTs there instead, keeps the returned key
# in memory and reads no Redis key. token_env is then required and is sent as
# "Authorization: Bearer <value>" (token_header must stay Authorization; https
# or loopback only). The same url/token_env serve the quote reader token_source below.
[kis.gatewayd]
url = "https://gatewayd.example.invalid:8791" # http is allowed only for loopback when token_env is set
token_env = "GATEWAYD_TOKEN"        # optional; unset means no auth header
token_header = "Authorization"      # header carrying the token_env value

[redis]
url = "rediss://redis.example.invalid:6380/0"

[stream]
key = "fills:kis"
max_len = 100000
consumer_group = "fillwire-ingest"
consumer_name = "fillwire-example"
claim_min_idle = "1m"
read_block = "5s"

[ingest]
url = "https://auto-trader.example.invalid/trading/api/execution-ledger/fills/ingest"
token_env = "EXECUTION_LEDGER_INGEST_TOKEN"
# Header the token travels in. The default (and the value below) must equal
# auto_trader's EXECUTION_LEDGER_INGEST_TOKEN_HEADER; a mismatch there or here
# makes every ingest POST fail with 401.
token_header = "X-Execution-Ledger-Ingest-Token"
batch_size = 200
timeout = "10s"

[channel]
buffer = 256
drain_timeout = "5s"

[retry]
min = "1s"
max = "30s"
factor = 2

[alerts]
rate_limit = "10m" # per failure class, per process

# Reconcile trigger client. Off unless enabled = true. After the initial KIS
# subscription and after every reconnect (and every interval, when set) it
# asks auto_trader to backfill the gap. It reuses [ingest] token_env and
# token_header; the token value is never logged. dry_run = true only reports
# what a backfill would do; switching it to false is a separate, approved
# change. Unknown keys in this table reject the config. See README
# "Reconcile trigger".
[reconcile]
enabled = false
url = "https://auto-trader.example.invalid/trading/api/execution-ledger/reconcile/trigger"
markets = ["kr"]  # fillwire subscribes only to domestic fills
dry_run = true
interval = "0s"   # 0 = no periodic trigger; otherwise at least 1m
timeout = "10s"

# Quote reader (Toss Securities realtime websocket: trade + orderbook ->
# quotes:toss). Off unless enabled = true. It reads the Toss access token that
# auto_trader keeps in Redis at [redis] url, read-only; it holds no Toss client
# id or secret and never issues or refreshes a token. It opens exactly one of
# the two Toss websocket connections the account allows. Unknown keys in this
# table reject the reader. See README "Quote reader".
# Optional token_source = "gatewayd-fetch" (instead of token_key) takes the
# token from gatewayd's /fetch via [kis.gatewayd] and keeps it in memory; it
# needs gatewayd with /fetch (hk 5760) and lets fillwire trigger a reissue
# after a handshake 401.
[quotes]
enabled = false
provider = "toss"
symbols_file = "/etc/fillwire/quote-symbols.txt" # "<kr|us> <code>" per line, at most 40
token_key = "toss:oauth:0000000000000000:access_token" # the cached token key; replace the 16-hex fingerprint
stream_key = "quotes:toss" # must start with quotes:
max_len = 100000 # XADD MAXLEN ~ N
buffer = 1024 # at most 65536

# Optional book snapshots on the existing KIS websocket; mock REST fallback.
# Exactly one access-token source is required: access_token_env names an
# environment variable, or access_token_source = "redis" reads the token that
# auto_trader publishes in [redis] (token_keys.py key contract; live reads
# kis:access_token, mock derives kis_mock:<netloc>:<app-key fingerprint>:
# access_token). The reader is read-only and never issues a token; the token
# value never appears in logs or errors.
[books]
enabled = false
symbol = "005930"
access_token_env = "KIS_MOCK_ACCESS_TOKEN"
access_token_source = "" # "" with access_token_env, or "redis"

# Binance Spot Demo market and user streams. Disabled unless enabled = true.
# Frames are appended to date-partitioned JSONL recordings; fills are never
# sent to the execution ledger. User stream credentials are read only when
# enabled and user_stream is true (default), from the documented environment
# names; values are never logged.
[binance_demo]
enabled = false
symbols = ["BTCUSDT"]
directory = "/var/lib/fillwire/recordings"
user_stream = true

# Toss/KIS 시세 레인의 장기 JSONL 기록. 기본 비활성화.
[recording]
enabled = false
directory = "/var/lib/fillwire/recordings"

# fillwire serve의 토스 개인 주문과 선택 시세 프레임은 연결을 공유하며 기본 비활성화입니다.
[toss_ws]
enabled = false
account_seq = ""
directory = "/var/lib/fillwire/recordings"
symbols_file = "" # 선택 사항: 줄마다 "<kr|us> <code>", 최대 40개

# 키움 모의 웹소켓 기록기. 계정별로 따로 실행합니다:
# fillwire kiwoom-kr 또는 fillwire kiwoom-us
[kiwoom_mock_kr]
enabled = false
symbols = []
directory = "/var/lib/fillwire/recordings"
app_key_env = "KIWOOM_MOCK_APP_KEY"
app_secret_env = "KIWOOM_MOCK_APP_SECRET"

[kiwoom_mock_us]
enabled = false
# symbols = [{ code = "NVDA", exchange = "ND" }]
symbols = []
directory = "/var/lib/fillwire/recordings"
app_key_env = "KIWOOM_MOCK_US_APP_KEY"
app_secret_env = "KIWOOM_MOCK_US_APP_SECRET"

# Upbit 공개 호가 및 체결 기록기. API 키와 비공개 웹소켓을 사용하지 않습니다.
[upbit]
enabled = false
markets_file = "/etc/fillwire/upbit-markets.txt" # 한 줄에 KRW 마켓 코드 하나, 최대 20개
directory = "/var/lib/fillwire/recordings"
retry_min = "1s"
retry_max = "30s"

# Alpaca paper 체결 알림 및 IEX 시세 기록기. 기본 비활성화.
[alpaca]
enabled = false
symbols = ["AAPL", "MSFT"]
directory = "/var/lib/fillwire/recordings"

# KIS 국내 지수선물(F200·MF200 근월·차월) 주간·야간 체결 -> 1분봉. 기존 KIS 웹소켓
# 세션과 구독 예산을 공유하며(등록 8건) 두 번째 세션을 열지 않습니다. live 전용.
# 닫힌 봉만 Redis Stream minute:kis:futures:<symbol> 또는 jsonl_path 파일에 씁니다.
# ingest 는 false 여야 합니다. true 는 설정 로드에서 거부합니다(auto_trader 선물 ingest 없음, hk 6430).
# README "KIS 지수선물 1분봉" 참조.
[kis_futures]
enabled = false
ingest = false
calendar_file = "/etc/fillwire/krx-calendar.json" # {"from","to","kr_closed":[...]}
jsonl_path = "" # "" = Redis Stream
max_len = 100000

# KIS 승격 종목 체결·호가. 기존 KIS 웹소켓 세션을 공유하며 두 번째 세션을 열지 않습니다.
# 등록 상한 41은 공식 문서로 확인하지 못한 보수값입니다([unverified]).
[kis_quotes]
enabled = false
symbols = [] # 우선순위 순서, 종목당 등록 2건
registration_limit = 41 # [unverified]
min_hold = "15m"
feed_gap = "30s"
max_len = 100000
buffer = 1024
access_token_env = "KIS_MOCK_ACCESS_TOKEN"
access_token_source = "" # "" with access_token_env, or "redis"

# KIS 모의(VTS) 국내 시세와 해외/선물옵션 체결통보를 기록만 합니다.
# `fillwire kis-mock-ws`로 실행하며 [kis] endpoint/account_mode는 모두 mock이어야 합니다.
# 보수적인 세션 등록 상한은 41건입니다(공식 한도는 미확인).
# app_key_env와 app_secret_env는 auto_trader의 KIS_MOCK_APP_KEY,
# KIS_MOCK_APP_SECRET을 사용합니다. 주문 또는 ledger ingest는 호출하지 않습니다.
[kis_mock_ws]
enabled = false
symbols = [] # 예: ["005930", "000660"]
futures_notice_tr_id = "H0IFCNI0" # 첫 모의 세션에서 확인 필요; H0IFCNI9로 전환 가능
recording_directory = "/var/lib/fillwire/recordings"
subscribe_pace = "500ms"

# fillwire upbit-fills: private myOrder recording for comparison with at-upbit-ws.
# Credentials come from UPBIT_ACCESS_KEY and UPBIT_SECRET_KEY.
[upbit_fills]
enabled = false
directory = "recordings"
