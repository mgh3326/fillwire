# Example-only configuration. All credentials are read from environment names;
# no credential value belongs in this public repository.

[kis]
broker = "kis"
endpoint = "live" # live or mock; this also selects the matching KIS TR.
account_mode = "live"
approval_mode = "" # default: Redis single-flight issue and refresh; cache-only remains available.
approval_refresh_margin = "1h"
venue = "krx"
hts_id = "EXAMPLE_HTS_ID"
app_key_env = "KIS_APP_KEY"
app_secret_env = "KIS_APP_SECRET"
event_buffer = 256
dup_track_max = 10000

[redis]
url = "rediss://redis.example.invalid:6380/0"

[stream]
key = "fills:kis"
max_len = 100000
consumer_group = "fillwire-ingest"
consumer_name = "fillwire-example"
claim_min_idle = "1m"
read_block = "5s"

[ingest]
url = "https://auto-trader.example.invalid/trading/api/execution-ledger/fills/ingest"
token_env = "EXECUTION_LEDGER_INGEST_TOKEN"
# Header the token travels in. The default (and the value below) must equal
# auto_trader's EXECUTION_LEDGER_INGEST_TOKEN_HEADER; a mismatch there or here
# makes every ingest POST fail with 401.
token_header = "X-Execution-Ledger-Ingest-Token"
batch_size = 200
timeout = "10s"

[channel]
buffer = 256
drain_timeout = "5s"

[retry]
min = "1s"
max = "30s"
factor = 2

[alerts]
rate_limit = "10m" # per failure class, per process

# Quote reader (Toss Securities realtime websocket: trade + orderbook ->
# quotes:toss). Off unless enabled = true. It reads the Toss access token that
# auto_trader keeps in Redis at [redis] url, read-only; it holds no Toss client
# id or secret and never issues or refreshes a token. It opens exactly one of
# the two Toss websocket connections the account allows. Unknown keys in this
# table reject the reader. See README "Quote reader".
[quotes]
enabled = false
provider = "toss"
symbols_file = "/etc/fillwire/quote-symbols.txt" # "<kr|us> <code>" per line, at most 40
token_key = "toss:oauth:0000000000000000:access_token" # the cached token key; replace the 16-hex fingerprint
stream_key = "quotes:toss" # must start with quotes:
max_len = 100000 # XADD MAXLEN ~ N
buffer = 1024 # at most 65536

# Optional book snapshots on the existing KIS websocket; mock REST fallback.
[books]
enabled = false
symbol = "005930"
access_token_env = "KIS_MOCK_ACCESS_TOKEN"

# Toss/KIS 시세 레인의 장기 JSONL 기록. 기본 비활성화.
[recording]
enabled = false
directory = "/var/lib/fillwire/recordings"

# Upbit 공개 호가 및 체결 기록기. API 키와 비공개 웹소켓을 사용하지 않습니다.
[upbit]
enabled = false
markets_file = "/etc/fillwire/upbit-markets.txt" # 한 줄에 KRW 마켓 코드 하나, 최대 20개
directory = "/var/lib/fillwire/recordings"
retry_min = "1s"
retry_max = "30s"
